<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการเวลาเวรพยาบาล</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👩‍⚕️</text></svg>">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="app-nav" class="navbar navbar-dark bg-primary shadow-sm d-none fixed-top">
        <div class="container" style="max-width: 600px;">
            <span class="navbar-brand mb-0 h1 fs-6 fw-bold"><i class="fa-solid fa-clock-history me-2"></i>TMS Nurse</span>
            <div class="d-flex gap-4 align-items-center">
                <a href="javascript:void(0);" id="nav-calendar" class="nav-link-custom active" onclick="navigateTo('page-calendar', this)">
                    <i class="fa-solid fa-calendar-days"></i>
                </a>
                <a href="javascript:void(0);" id="nav-pending" class="nav-link-custom position-relative" onclick="navigateTo('page-pending', this)">
                    <i class="fa-solid fa-bell"></i>
                    <span id="pending-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 8px;">
                        0
                    </span>
                </a>
                <a href="javascript:void(0);" id="nav-summary" class="nav-link-custom" onclick="navigateTo('page-summary', this)">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="javascript:void(0);" id="nav-manage" class="nav-link-custom d-none" onclick="navigateTo('page-manage', this)">
                    <i class="fa-solid fa-pen-to-square"></i>
                </a>
                <a href="javascript:void(0);" id="nav-users" class="nav-link-custom d-none" onclick="navigateTo('page-users', this)">
                    <i class="fa-solid fa-users-gear"></i>
                </a>
                <a href="javascript:void(0);" class="nav-link-custom text-warning" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>
    </nav>

    <div id="content-area" style="padding-top: 60px;">
        <!-- Page Sections will be loaded here -->
        <div id="page-login" class="page-section active" style="margin-top: -60px;">
            <!-- Login Component -->
        </div>
        <div id="page-calendar" class="page-section">
            <!-- Calendar Component -->
        </div>
        <div id="page-manage" class="page-section">
            <!-- Manage Schedule Component -->
        </div>
        <div id="page-users" class="page-section">
            <!-- Manage Users Component -->
        </div>
        <div id="page-pending" class="page-section">
            <!-- Pending Swaps Component -->
        </div>
        <div id="page-summary" class="page-section">
            <!-- Shift Summary Component -->
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm p-3">
            <div class="modal-content" style="border-radius: 15px; border: none;">
                <div class="modal-body text-center p-4">
                    <div class="text-danger mb-3">
                        <i class="fa-solid fa-right-from-bracket fa-3x"></i>
                    </div>
                    <h5 class="fw-bold mb-2">ออกจากระบบ</h5>
                    <p class="text-muted small mb-4">คุณต้องการออกจากระบบใช่หรือไม่คะ?</p>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-light w-50 small fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
                        <button type="button" class="btn btn-danger w-50 small fw-bold" onclick="executeLogout()">ตกลง</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Logic -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    
    <!-- Components -->
    <script src="components/login.js"></script>
    <script src="components/calendar.js"></script>
    <script src="components/manage-schedule.js"></script>
    <script src="components/manage-users.js"></script>
    <script src="components/pending-swaps.js"></script>
    <script src="components/shift-summary.js"></script>

</body>
</html>
